# Time-limited exceptions for the batch image scan (ADR-0020). Each is the Go standard library
# inside the base image's local-test emulator, which runs only where AWS_LAMBDA_RUNTIME_API is
# unset (not in Lambda; the Fargate task overrides the entry point). Delete the entries when
# AWS ships a base image with a fixed Go; they expire on their own on 2026-11-08.
vulnerabilities:
  - id: CVE-2026-78667
    paths:
      - "usr/local/bin/aws-lambda-rie"
    statement: net/http range-header DoS in the base image's local-test emulator, not run in Lambda; fixed in Go 1.26.9
    expired_at: 2026-11-08
  - id: CVE-2026-97031
    paths:
      - "usr/local/bin/aws-lambda-rie"
    statement: crypto/tls ECH DoS in the base image's local-test emulator, not run in Lambda; fixed in Go 1.26.9
    expired_at: 2026-11-08
