# Hooks call the mise- and uv-pinned binaries, so versions live in one place.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: mise exec -- gitleaks git --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      # Check only the staged Terraform files and never write: `fmt -recursive` also rewrote the
      # git-ignored *.tfvars, which hold private values (tests/test_precommit_terraform_fmt.py).
      - id: terraform-fmt
        name: terraform fmt
        entry: mise exec -- terraform fmt -check
        language: system
        files: ^infra/.*\.(tf|tftest\.hcl)$
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: opa-fmt
        name: opa fmt
        entry: mise exec -- opa fmt --list --fail policy
        language: system
        files: ^policy/.*\.rego$
        pass_filenames: false
      - id: opa-test
        name: opa check + test
        entry: mise exec -- bash -c 'opa check --strict policy && opa test policy'
        language: system
        files: ^policy/.*\.rego$
        pass_filenames: false
