version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PySpark must equal the AWS Glue runtime's Spark version (ADR-0007: Glue 5.1 -> 3.5.6).
      # Version updates (including patches) are manual and move with the Glue version. Only
      # version-update types are listed, so security updates are not ignored; Dependabot alerts
      # and the dependency-audit workflow monitor vulnerabilities regardless.
      - dependency-name: pyspark
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
