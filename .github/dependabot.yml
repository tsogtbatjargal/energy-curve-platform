version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PySpark must equal the AWS Glue runtime's Spark version (ADR-0007: Glue 5.1 -> 3.5.6).
      # Every PySpark update, including patches, is a manual change made with the Glue version.
      - dependency-name: pyspark
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
