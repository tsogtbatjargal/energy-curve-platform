version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PySpark must equal the AWS Glue runtime's Spark version (ADR-0007: Glue 5.1 -> 3.5.6).
      # Version updates (including patches) are manual and move with the Glue version. Only
      # version-update types are listed, so security updates are not ignored; Dependabot alerts
      # and the dependency-audit workflow monitor vulnerabilities regardless.
      - dependency-name: pyspark
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
  # The batch image (ADR-0020): both FROM lines are pinned as tag@sha256 (the uv build stage and
  # the Lambda Python base), so Dependabot proposes new digests when either tag moves.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Lambda base stays on Python 3.12, the project's runtime (ADR-0020). Dependabot labels
      # 3.12 -> 3.14 a semver-minor update; ignoring minor and major updates keeps the Python
      # version fixed while new digests for the 3.12 tag still arrive.
      - dependency-name: lambda/python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
