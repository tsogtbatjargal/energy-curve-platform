name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; each job opts in to what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job timeouts: about twice the slowest healthy run over 15 recent runs, at least 5 minutes,
# so a hang fails in minutes instead of running to GitHub's 6-hour default.
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the mirrored service images with the workflow token
    env:
      DATABASE_URL: postgresql://ecp:ecp@localhost:5432/ecp
      ECP_REQUIRE_POSTGRES: "1" # database tests fail rather than skip when Postgres is missing
      REDIS_URL: redis://localhost:6379/0
      ECP_REQUIRE_VALKEY: "1" # cache and event tests fail rather than skip when Valkey is missing
      ECP_REQUIRE_CONFTEST: "1" # the policy-gate integration tests fail rather than skip
    # Service images come from this repository owner's GHCR mirror (mirror-ci-images.yml copies the
    # upstream images by digest). Docker Hub's, then ECR Public's, anonymous pull limits failed
    # runs. The digest alone decides what runs (the upstream Postgres 17.11 and Valkey 9.1.2 tags
    # are only labels), so any registry must serve exactly the pinned bytes. The pull is
    # authenticated with the workflow token (packages: read).
    services:
      postgres:
        image: ghcr.io/tsogtbatjargal/ecp-ci-postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: ecp
          POSTGRES_PASSWORD: ecp
          POSTGRES_DB: ecp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecp -d ecp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: ghcr.io/tsogtbatjargal/ecp-ci-valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: python uv conftest
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Playwright's pinned Chromium for the browser tests (ADR-0016); the version follows uv.lock.
      - run: uv run playwright install --with-deps chromium
        timeout-minutes: 5  # healthy installs take 18-149 s; one hung for over 30 min
      - run: uv run pytest --tracing retain-on-failure --output test-results
      # Traces only on failure. Browser tests use synthetic data only (ADR-0011).
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: gitleaks
      - run: gitleaks git --redact --no-banner .

  iac-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: terraform opa trivy actionlint
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      # ADR-0021 phase 3: the bootstrap stack's instance guard and member resources, planned
      # against a mocked AWS provider. No credentials and no backend.
      - name: terraform test (bootstrap, mocked provider)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap test
      # M4c (ADR-0022): the batch stack's two stages (no image, then an image by digest),
      # planned and applied against a mocked AWS provider. No credentials and no backend.
      - name: terraform test (batch, mocked provider)
        run: |
          terraform -chdir=infra/batch init -backend=false -input=false
          terraform -chdir=infra/batch test
      # M5b (ADR-0023): the Glue stack, planned and applied against a mocked AWS provider. The
      # bundle it uploads is built first (stdlib only). No credentials and no backend.
      - name: terraform test (glue, mocked provider)
        run: |
          python3 scripts/build_glue_bundle.py
          terraform -chdir=infra/glue init -backend=false -input=false
          terraform -chdir=infra/glue test
      # M5c-1 (ADR-0023): the Redshift stack, planned and applied against a mocked AWS provider.
      # No credentials and no backend.
      - name: terraform test (redshift, mocked provider)
        run: |
          terraform -chdir=infra/redshift init -backend=false -input=false
          terraform -chdir=infra/redshift test
      - name: rego fmt, compile, unit tests
        run: |
          opa fmt --list --fail policy
          opa check --strict policy
          opa test policy
      - name: trivy config scan
        run: |
          trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL infra
          trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL Dockerfile
      - name: actionlint
        run: actionlint

  image:
    # The batch image (M4, ADR-0020): build it, scan it for fixed HIGH/CRITICAL vulnerabilities,
    # and run both entry points on a file store. The pipeline step runs with no network, as it
    # needs none. A required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # pull the mirrored service images with the workflow token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: trivy
      - name: build
        run: docker build --platform linux/amd64 -t ecp-batch:ci .
      - name: scan the image for fixed HIGH/CRITICAL vulnerabilities
        run: trivy image --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed ecp-batch:ci
      - name: smoke test both entry points
        run: |
          store="$(mktemp -d)" && chmod 777 "$store"
          # The image has no emulator (Dockerfile). Mount AWS's release v1.37, checked by hash and
          # read-only, only for this step; the scan above never sees it.
          rie="$(mktemp -d)"
          curl -sSfL -o "$rie/aws-lambda-rie" \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/download/v1.37/aws-lambda-rie-x86_64
          echo "6b1e686e62ab2baf5759c412c4864276ef2a88b094fca53ec070637ccba9b9a5  $rie/aws-lambda-rie" | sha256sum -c -
          chmod +x "$rie/aws-lambda-rie"
          docker run -d --name ecp-lambda -p 127.0.0.1:9123:8080 -v "$store:/store" \
            -v "$rie/aws-lambda-rie:/usr/local/bin/aws-lambda-rie:ro" \
            -e ECP_STORE_URL=file:///store ecp-batch:ci
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:9123/ && break; sleep 1; done
          curl -sf -XPOST http://127.0.0.1:9123/2015-03-31/functions/function/invocations \
            -d '{"run_id":"ci-1","today":"2024-03-15"}' | tee staged.json
          docker rm -f ecp-lambda
          grep -q '"pages": 1' staged.json
          docker run --rm --network none -v "$store:/store" -e ECP_STORE_URL=file:///store \
            --entrypoint python ecp-batch:ci -m energy_curves.cloud task ci-1 | tail -1 | tee run.json
          grep -q '"status": "published"' run.json
      - name: smoke test the negative-price day and the publish repair
        run: docker run --rm -i --network none --entrypoint python ecp-batch:ci - < scripts/image_smoke.py

      - name: log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: smoke test the installed API and UI
        run: |
          # Pull pinned dependencies before isolating the runtime network from the internet.
          postgres=ghcr.io/tsogtbatjargal/ecp-ci-postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
          valkey=ghcr.io/tsogtbatjargal/ecp-ci-valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          pull_with_retry() {
            local image=$1 attempt
            for ((attempt = 1; attempt <= 5; attempt++)); do
              if docker pull "$image"; then
                return 0
              fi
              if ((attempt == 5)); then
                echo "Failed to pull $image after 5 attempts" >&2
                return 1
              fi
              echo "Pull attempt $attempt failed; retrying in $((attempt * 15)) seconds" >&2
              sleep "$((attempt * 15))"
            done
          }
          pull_with_retry "$postgres"
          pull_with_retry "$valkey"
          cli="from energy_curves import main; main()"
          docker network create --internal ecp-api-smoke
          trap 'docker rm -f ecp-api ecp-api-pg ecp-api-valkey; docker network rm ecp-api-smoke' EXIT
          docker run -d --name ecp-api-pg --network ecp-api-smoke --network-alias postgres \
            -e POSTGRES_USER=ecp -e POSTGRES_PASSWORD=ecp -e POSTGRES_DB=ecp "$postgres"
          docker run -d --name ecp-api-valkey --network ecp-api-smoke --network-alias valkey "$valkey"
          for _ in $(seq 30); do docker exec ecp-api-pg pg_isready -U ecp -d ecp && break; sleep 1; done
          docker run --rm --network ecp-api-smoke \
            -e DATABASE_URL=postgresql://ecp:ecp@postgres:5432/ecp \
            --entrypoint python ecp-batch:ci -c "$cli" db-migrate
          docker run -d --name ecp-api --network ecp-api-smoke \
            -e DATABASE_URL=postgresql://ecp:ecp@postgres:5432/ecp \
            -e REDIS_URL=redis://valkey:6379/0 \
            --entrypoint python ecp-batch:ci -c "$cli" serve --port 8000
          docker exec -i ecp-api python - < scripts/image_api_smoke.py

  glue-compat:
    # AWS Glue 5.1 runtime (ADR-0007): Python 3.11, Java 17, PySpark 3.5.6. Runs the whole suite
    # plus the glue_compat checks, which assert those exact versions.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      packages: read # pull the mirrored service images with the workflow token
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql://ecp:ecp@localhost:5432/ecp
      ECP_REQUIRE_POSTGRES: "1"
      REDIS_URL: redis://localhost:6379/0
      ECP_REQUIRE_VALKEY: "1"
    # Service images come from this repository owner's GHCR mirror (mirror-ci-images.yml copies the
    # upstream images by digest). Docker Hub's, then ECR Public's, anonymous pull limits failed
    # runs. The digest alone decides what runs (the upstream Postgres 17.11 and Valkey 9.1.2 tags
    # are only labels), so any registry must serve exactly the pinned bytes. The pull is
    # authenticated with the workflow token (packages: read).
    services:
      postgres:
        image: ghcr.io/tsogtbatjargal/ecp-ci-postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: ecp
          POSTGRES_PASSWORD: ecp
          POSTGRES_DB: ecp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecp -d ecp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: ghcr.io/tsogtbatjargal/ecp-ci-valkey@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: java uv
      - run: uv sync --locked --python 3.11
      - run: uv run --python 3.11 python --version
      # Everything, glue_compat included, except the browser tests: this job is about the
      # Glue runtime, and the python job runs the UI tests (ADR-0016).
      - run: uv run --python 3.11 pytest -m "not browser"

  terraform-plan:
    needs: [python, iac-static]
    # Fork PRs get no OIDC token; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, batch, glue, redshift]
    defaults:
      run:
        shell: bash
        working-directory: infra/${{ matrix.stack }}
    env:
      STACK: ${{ matrix.stack }}
      # Secrets, not variables: the plan role ARN and the bucket name hold the account ID, and a
      # public log prints a variable's value. Dependabot has matching Dependabot secrets.
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Which bootstrap instance CI plans (infra/bootstrap/guard.tf, ADR-0021 phase 4). A repo
      # variable, so it flips together with AWS_PLAN_ROLE_ARN and TF_STATE_BUCKET; unset means
      # the management instance.
      TF_VAR_member_instance: ${{ vars.TF_MEMBER_INSTANCE || 'false' }}
      TF_IN_AUTOMATION: "1"
      # The batch stack's alert address is private and never in CI: this placeholder is harmless
      # because the subscription ignores endpoint changes (ADR-0022). Its image digest and
      # schedule flag come from the tracked infra/batch/image.auto.tfvars.
      TF_VAR_alert_email: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: terraform conftest python uv
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
          mask-aws-account-id: true
      # The stack refuses to plan outside expected_account_id (infra/bootstrap/guard.tf,
      # ADR-0021 phase 3). CI's account is the one in the plan role it assumes.
      - name: expected account
        env:
          AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          echo "TF_VAR_expected_account_id=$(cut -d: -f5 <<< "$AWS_PLAN_ROLE_ARN")" >> "$GITHUB_ENV"
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STACK}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      # The budget and its alert emails moved to infra/org (ADR-0021 phase 1a), which CI never
      # plans: it lives in the management account and is applied by the Identity Center admin.
      - name: terraform plan
        if: matrix.stack == 'bootstrap'
        run: |
          terraform plan -input=false -lock-timeout=60s -out=tfplan
          terraform show -json tfplan > plan.json
      # The log of this public repository gets the summary line only: the plan goes to a file, an
      # error shows its first line with 12-digit numbers masked, and the files are removed below.
      # Informational: an infra/batch change merged but not yet applied shows as a change.
      - name: terraform plan (batch, summary only)
        if: matrix.stack == 'batch'
        run: |
          status=0
          terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > plan.txt 2>&1 || status=$?
          grep -E '^(Plan:|No changes)' plan.txt || true
          if [ "$status" -ne 0 ]; then
            echo "terraform plan failed (exit $status)"
            grep -E '^Error' plan.txt | sed -E 's/[0-9]{12}/<account>/g' | head -5 || true
            exit "$status"
          fi
          terraform show -json tfplan > plan.json
      # The Glue stack uploads a bundle built from the repository; the build comes first, then the
      # same summary-only plan as batch. Informational until it is applied: it shows 13 creates.
      - name: build the Glue bundle
        if: matrix.stack == 'glue'
        run: python ../../scripts/build_glue_bundle.py
      - name: terraform plan (glue, summary only)
        if: matrix.stack == 'glue'
        run: |
          status=0
          terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > plan.txt 2>&1 || status=$?
          grep -E '^(Plan:|No changes)' plan.txt || true
          if [ "$status" -ne 0 ]; then
            echo "terraform plan failed (exit $status)"
            grep -E '^Error' plan.txt | sed -E 's/[0-9]{12}/<account>/g' | head -5 || true
            exit "$status"
          fi
          terraform show -json tfplan > plan.json
      # The Redshift stack, summary only like batch and glue. Informational until it is applied: it
      # shows 18 creates. The state key redshift/terraform.tfstate does not exist yet, so the plan
      # starts from an empty state; the plan role only reads.
      - name: terraform plan (redshift, summary only)
        if: matrix.stack == 'redshift'
        run: |
          status=0
          terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > plan.txt 2>&1 || status=$?
          grep -E '^(Plan:|No changes)' plan.txt || true
          if [ "$status" -ne 0 ]; then
            echo "terraform plan failed (exit $status)"
            grep -E '^Error' plan.txt | sed -E 's/[0-9]{12}/<account>/g' | head -5 || true
            exit "$status"
          fi
          terraform show -json tfplan > plan.json
      - name: policy gate
        if: matrix.stack == 'bootstrap'
        # --stack selects the R1 rules: unknown IAM policies fail in workload stacks unless
        # policy/approvals/iam_unknown.json approves their fingerprint (ADR-0017). Only the gate's
        # dependency group (python-hcl2, to read locals from the source) is installed.
        run: uv run --locked --only-group gate python ../../scripts/policy_gate.py plan.json ../../policy --stack "$STACK"
      - name: policy gate (batch)
        if: matrix.stack == 'batch'
        # The batch stack's rules read its source for locals, hence --stack-dir (ADR-0022).
        run: uv run --locked --only-group gate python ../../scripts/policy_gate.py plan.json ../../policy --stack "$STACK" --stack-dir .
      - name: policy gate (glue)
        if: matrix.stack == 'glue'
        # The Glue stack's rules read its source for locals, hence --stack-dir (ADR-0023).
        run: uv run --locked --only-group gate python ../../scripts/policy_gate.py plan.json ../../policy --stack "$STACK" --stack-dir .
      - name: policy gate (redshift)
        if: matrix.stack == 'redshift'
        # The Redshift stack's rules read its source for locals, hence --stack-dir (ADR-0023).
        run: uv run --locked --only-group gate python ../../scripts/policy_gate.py plan.json ../../policy --stack "$STACK" --stack-dir .
      - name: remove plan artifacts
        if: always()
        run: rm -f tfplan plan.json plan.txt
