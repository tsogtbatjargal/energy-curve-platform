name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; each job opts in to what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ecp:ecp@localhost:5432/ecp
      ECP_REQUIRE_POSTGRES: "1" # database tests fail rather than skip when Postgres is missing
      REDIS_URL: redis://localhost:6379/0
      ECP_REQUIRE_VALKEY: "1" # cache and event tests fail rather than skip when Valkey is missing
      ECP_REQUIRE_CONFTEST: "1" # the policy-gate integration tests fail rather than skip
    services:
      postgres:
        image: docker.io/library/postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: ecp
          POSTGRES_PASSWORD: ecp
          POSTGRES_DB: ecp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecp -d ecp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: docker.io/valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python uv conftest
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Playwright's pinned Chromium for the browser tests (ADR-0016); the version follows uv.lock.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --tracing retain-on-failure --output test-results
      # Traces only on failure. Browser tests use synthetic data only (ADR-0011).
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: gitleaks
      - run: gitleaks git --redact --no-banner .

  iac-static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform opa trivy actionlint
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: rego fmt, compile, unit tests
        run: |
          opa fmt --list --fail policy
          opa check --strict policy
          opa test policy
      - name: trivy config scan
        run: trivy config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL infra
      - name: actionlint
        run: actionlint

  glue-compat:
    # AWS Glue 5.1 runtime (ADR-0007): Python 3.11, Java 17, PySpark 3.5.6. Runs the whole suite
    # plus the glue_compat checks, which assert those exact versions.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
      DATABASE_URL: postgresql://ecp:ecp@localhost:5432/ecp
      ECP_REQUIRE_POSTGRES: "1"
      REDIS_URL: redis://localhost:6379/0
      ECP_REQUIRE_VALKEY: "1"
    services:
      postgres:
        image: docker.io/library/postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: ecp
          POSTGRES_PASSWORD: ecp
          POSTGRES_DB: ecp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecp -d ecp"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: docker.io/valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: java uv
      - run: uv sync --locked --python 3.11
      - run: uv run --python 3.11 python --version
      # Everything, glue_compat included, except the browser tests: this job is about the
      # Glue runtime, and the python job runs the UI tests (ADR-0016).
      - run: uv run --python 3.11 pytest -m "not browser"

  terraform-plan:
    needs: [python, iac-static]
    # Fork PRs get no OIDC token; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap]
    defaults:
      run:
        shell: bash
        working-directory: infra/${{ matrix.stack }}
    env:
      STACK: ${{ matrix.stack }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform conftest python uv
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
          mask-aws-account-id: true
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STACK}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: terraform plan
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
        run: |
          terraform plan -input=false -lock-timeout=60s -out=tfplan
          terraform show -json tfplan > plan.json
      - name: policy gate
        # --stack selects the R1 rules: unknown IAM policies fail in workload stacks unless
        # policy/approvals/iam_unknown.json approves their fingerprint (ADR-0017). Only the gate's
        # dependency group (python-hcl2, to read locals from the source) is installed.
        run: uv run --locked --only-group gate python ../../scripts/policy_gate.py plan.json ../../policy --stack "$STACK"
      - name: remove plan artifacts
        if: always()
        run: rm -f tfplan plan.json
